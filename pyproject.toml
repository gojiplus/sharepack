[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "sharepack"
description = "Turn a local Python web app into a single HTML file anyone can open. No server, no tunnel, no install."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gaurav Sood" }]
keywords = ["django", "pyodide", "wasm", "demo", "share", "single-file"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gojiplus/sharepack"
Repository = "https://github.com/gojiplus/sharepack"
Documentation = "https://gojiplus.github.io/sharepack/"

[project.scripts]
sharepack = "sharepack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sharepack"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["tests/fixtures_tasktrack"]

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
"src/sharepack/cli.py" = ["T201"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[dependency-groups]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    { include-group = "test" },
]
test = ["pytest>=8", "pytest-cov>=6"]
